            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reordered: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: A malformed id, a repeated id, or an id with no matching product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }

  /admin/products/{id}:
    get:
      tags: [Admin]
      summary: Read one product, with its children
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin]
      summary: Update a product
      description: |
        Send only what is changing. A child array (`pack_sizes`, `highlights` or
        `images`) is only touched when its key is present in the body —
        omitting `pack_sizes` entirely leaves them exactly as they were.
        Sending `"pack_sizes": []` **does** clear them; the two are not the
        same thing, on purpose.

        `slug` is **not** re-derived when `name` changes. Renaming a published
        product must not silently move its URL — only an explicit `slug` in
        the body changes it.
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: Updated, with its children.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The requested slug, or a pack size's SKU, is already in use elsewhere.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Admin]
      summary: Delete a product
      description: |
        Soft delete, idempotent — same reasoning as categories. **Never**
        cascades to the child tables the way a real `DELETE` would: the pack
        sizes, highlights and images are untouched, because unpublishing a
        product for a day must not be the same operation as destroying its
        catalogue data.
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Deleted (or already was).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # Pack sizes, highlights and images share one shape — list, create, reorder,
  # get one, update one, delete one — scoped to the product in the path. Each
  # is documented once at that level of detail; the three differ only in the
  # fields their own input schema carries.

  /admin/products/{id}/pack-sizes:
    get:
      tags: [Admin]
      summary: List a product's pack sizes
      security: [{ adminBearer: [] }]
