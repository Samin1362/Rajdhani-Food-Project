                      data: { type: array, items: { $ref: '#/components/schemas/PackSize' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Admin]
      summary: Add a pack size
      description: |
        `sku` is unique **globally**, across every product — not just this one.
        `discount_percent` is never accepted from the client: it is derived
        from `price` and `compare_price` on every write, because a
        client-supplied percentage could disagree with the two prices next to
        it. Setting `is_default: true` unsets it on every other pack size of
        this product, so exactly one (or none) is ever the default.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackSizeInput' }
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PackSize' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The SKU is already in use, or this product already has a pack size with this label.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/products/{id}/pack-sizes/reorder:
